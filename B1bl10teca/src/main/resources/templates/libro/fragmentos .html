<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <body>

        <!-- Fragmento: Formulario para agregar o editar libro -->
        <section th:fragment="agregarLibro">
            <div class="row py-4 mb-2 bg-light">
                <div class="col-md-3">
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#agregarLibroModal">
                        <i class="fa-solid fa-plus"></i> Agregar Libro
                    </button>
                </div>
            </div>

            <div class="modal fade" id="agregarLibroModal" tabindex="-1" aria-labelledby="agregarLibroLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header bg-info text-white">
                            <h5 class="modal-title" id="agregarLibroLabel">
                                <i class="fa-solid fa-book"></i> Nuevo Libro
                            </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                        </div>
                        <form th:action="@{/libro/guardar}" th:object="${libro}" method="post" class="was-validated">
                            <div class="modal-body">
                                <div class="mb-3">
                                    <label for="titulo">Título</label>
                                    <input type="text" th:field="*{titulo}" class="form-control" id="titulo" required />
                                </div>
                                <div class="mb-3">
                                    <label for="autor">Autor</label>
                                    <input type="text" th:field="*{autor}" class="form-control" id="autor" required />
                                </div>
                                <div class="mb-3">
                                    <label for="categoria">Categoría</label>
                                    <select th:field="*{categoria.idCategoria}" class="form-select" id="categoria" required>
                                        <option th:each="cat : ${categorias}" th:value="${cat.idCategoria}" th:text="${cat.descripcion}"></option>
                                    </select>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                    <i class="fa-solid fa-xmark"></i> Cerrar
                                </button>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fa-solid fa-floppy-disk"></i> Guardar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <!-- Fragmento: Listado de libros -->
        <section th:fragment="listadoLibros" class="p-3">
            <div class="card p-3">
                <h4 class="card-header">Listado de Libros</h4>
                <div class="card-body">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Título</th>
                                <th>Autor</th>
                                <th>Categoría</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="libro : ${libros}">
                                <td th:text="${libro.idLibro}"></td>
                                <td th:text="${libro.titulo}"></td>
                                <td th:text="${libro.autor}"></td>
                                <td th:text="${libro.categoria.descripcion}"></td>
                                <td>
                                    
                                    <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#confirmEliminarLibroModal" 
                                            th:data-bs-id="${libro.idLibro}" th:data-bs-titulo="${libro.titulo}">
                                        <i class="fa-solid fa-trash"></i> Eliminar
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Fragmento: Confirmar eliminación -->
        <section th:fragment="confirmarEliminarLibro">
            <div class="modal fade" id="confirmEliminarLibroModal" tabindex="-1" aria-labelledby="confirmLibroLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <form th:action="@{/libro/eliminar}" method="post">
                            <input type="hidden" name="idLibro" id="modalLibroId" />
                            <div class="modal-header bg-danger text-white">
                                <h5 class="modal-title" id="confirmLibroLabel">
                                    <i class="fa-solid fa-circle-exclamation"></i> Confirmar Eliminación
                                </h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                            </div>
                            <div class="modal-body">
                                <p>¿Estás seguro que deseas eliminar el libro <strong><span id="modalLibroTitulo"></span></strong>?</p>
                            </div>
                            <div class="modal-footer">
                                <button type="submit" class="btn btn-danger">
                                    <i class="fa-solid fa-trash"></i> Eliminar
                                </button>
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                    <i class="fa-solid fa-xmark"></i> Cancelar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <script>
            // Script para pasar datos al modal de confirmación eliminar
            var eliminarModal = document.getElementById('confirmEliminarLibroModal');
            eliminarModal.addEventListener('show.bs.modal', function (event) {
                var button = event.relatedTarget;
                var idLibro = button.getAttribute('data-bs-id');
                var tituloLibro = button.getAttribute('data-bs-titulo');
                var modalIdInput = eliminarModal.querySelector('#modalLibroId');
                var modalTituloSpan = eliminarModal.querySelector('#modalLibroTitulo');

                modalIdInput.value = idLibro;
                modalTituloSpan.textContent = tituloLibro;
            });
        </script>

    </body>
</html>
