<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Fragmento para agregar/modificar queja -->
<section th:fragment="agregarQueja" class="p-3">
    <form th:action="@{/quejas/guardar}" th:object="${queja}" method="post">
        <div class="mb-3">
            <label for="asunto" class="form-label">Asunto</label>
            <input type="text" id="asunto" th:field="*{asunto}" class="form-control" placeholder="Asunto" required />
        </div>
        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea id="descripcion" th:field="*{descripcion}" class="form-control" rows="4" placeholder="Descripción" required></textarea>
        </div>
        <div class="mb-3">
            <label for="usuario" class="form-label">Usuario</label>
            <input type="text" id="usuario" th:field="*{usuario}" class="form-control" placeholder="Usuario" required />
        </div>
        <button type="submit" class="btn btn-primary">Guardar</button>
    </form>
</section>

<!-- Fragmento para listado de quejas -->
<section th:fragment="listadoQuejas" class="p-3">
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Asunto</th>
                <th>Usuario</th>
                <th>Fecha</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="queja : ${quejas}">
                <td th:text="${queja.id}"></td>
                <td th:text="${queja.asunto}"></td>
                <td th:text="${queja.usuario}"></td>
                <td th:text="${#dates.format(queja.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></td>
                <td>
                    <a th:href="@{'/quejas/modificar/' + ${queja.id}}" class="btn btn-warning btn-sm">Editar</a>
                    <form th:action="@{/quejas/eliminar}" method="post" style="display:inline;">
                        <input type="hidden" name="id" th:value="${queja.id}" />
                        <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar esta queja?');">Eliminar</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</section>

</body>
</html>
